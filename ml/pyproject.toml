[project]
name = "axiom-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=1.26,<2",
    "pillow>=10",
    "torch>=2.7",
    "torchvision",
    "sam3",
    "einops",
    "pycocotools",
    "psutil",
    "setuptools<81",
    "opencv-python-headless>=4.11.0.86",
]

[tool.uv.sources]
sam3 = { git = "https://github.com/facebookresearch/sam3.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["axiom_ml"]
